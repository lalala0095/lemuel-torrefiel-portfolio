steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/portfolio-api:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/portfolio-api:latest'
      - '.'

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/portfolio-api:$SHORT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '--filename=.'
      - '--image=gcr.io/$PROJECT_ID/portfolio-api:$SHORT_SHA'
      - '--location=us-central1'
  
  # Deploy to Cloud Run (simpler method)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'portfolio-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/portfolio-api:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/portfolio-api:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/portfolio-api:latest'
